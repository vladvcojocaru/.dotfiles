# picom.conf - Minimal config for transparency without animations

# Use backend that supports transparency
backend = "glx";

# Disable all animations and transitions
fading = false;
fade-in-step = 0.0;
fade-out-step = 0.0;
fade-delta = 0;

# No shadows
shadow = false;

# No blur (keep text sharp)
blur = false;

# Enable transparency globally
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

# Apply transparency only to terminal windows (modify if needed)

# Ensure VSync is on to prevent tearing
vsync = true;

# No inactive window dimming
inactive-dim = 0.0;

# Exclude fullscreen windows from transparency
unredir-if-possible = true;

