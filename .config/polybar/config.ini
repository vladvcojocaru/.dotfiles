[bar/mybar]
width = 100%
height = 30
background = #1e1e2e
foreground = #cdd6f4
border-size = 2
border-color = #313244
padding-left = 1
padding-right = 1
separator = |
font-0 = JetBrainsMono Nerd Font:size=10;weight=bold

modules-left = i3
modules-center = date
modules-right = cpu memory battery network

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
label-focused = %name% 
label-unfocused = %name%

[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d %H:%M:%S
label = %{F#f9e2af} %date% 

[module/cpu]
type = internal/cpu
interval = 2
format = CPU: <ramp-coreload>
ramp-coreload-0 = ▁
ramp-coreload-1 = ▂
ramp-coreload-2 = ▃
ramp-coreload-3 = ▄
ramp-coreload-4 = ▅
ramp-coreload-5 = ▆
ramp-coreload-6 = ▇
ramp-coreload-7 = █

[module/memory]
type = internal/memory
format = RAM: %gb_used%/%gb_total%GB


[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
poll-interval = 5
full-at = 99
format-charging = ⚡ %percentage%%
format-discharging = 🔋 %percentage%%
format-full = 🔋 Full

[module/network]
type = internal/network
interface = wlan0
format-connected = 📶 %essid% (%signal%%)
format-disconnected = ❌ Offline

