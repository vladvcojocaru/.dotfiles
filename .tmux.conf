# Set prefix key to Ctrl-a (default is Ctrl-b)
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# Enable mouse support
set-option -g mouse on

# Start with a numbered index for panes and windows
set-option -g base-index 1
setw -g pane-base-index 1

# Set the default shell
# set-option -g default-shell /bin/bash

# Enable status bar with customization
# set-option -g status on
# set-option -g status-bg black
# set-option -g status-fg white

# Shortcuts for pane splitting
# bind | split-window -h
# bind - split-window -v
# unbind '"'
# unbind %

# Enable easier pane navigation
# bind h select-pane -L
# bind j select-pane -D
# bind k select-pane -U
# bind l select-pane -R

# Reload tmux config without restarting
# bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

